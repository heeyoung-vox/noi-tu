name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "noi-tu-backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "noi-tu-backend/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./noi-tu-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: backend-jar
          path: noi-tu-backend/build/libs/app.jar
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-backend
      cancel-in-progress: false

    env:
      SSH_TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}

    steps:
      - name: Download JAR
        uses: actions/download-artifact@v8
        with:
          name: backend-jar

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Copy JAR to server
        run: scp app.jar "$SSH_TARGET":/tmp/app.jar.new

      - name: Install JAR and restart service
        run: |
          ssh "$SSH_TARGET" '
            set -e
            sudo install -o root -g noitu -m 640 /tmp/app.jar.new /opt/noitu/app.jar.new
            sudo mv /opt/noitu/app.jar.new /opt/noitu/app.jar
            rm /tmp/app.jar.new
            sudo systemctl restart noitu
          '

      - name: Check the live health endpoint
        run: |
          curl --fail --silent --show-error \
            --retry 40 --retry-delay 5 --retry-all-errors \
            https://api.noitu.vohuydang.io.vn/actuator/health
