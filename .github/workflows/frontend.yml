name: React CI


on:
  push:
    branches: [main]
    paths:
      - "noi-tu-frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [main]
    paths:
      - "noi-tu-frontend/**"
      - ".github/workflows/frontend.yml"
permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: ./noi-tu-frontend

jobs:
  build-and-test:
    runs-on: ubuntu-latest


    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: noi-tu-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint


      - name: Build project
        run: npm run build
